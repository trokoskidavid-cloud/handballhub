# Local development environment: `docker-compose up` (or `docker compose up`)
# starts MongoDB + the HandballHub app and seeds the database on first run.
services:
  mongo:
    image: mongo:7
    container_name: handballhub-mongo
    restart: unless-stopped
    # MongoDB logs every healthcheck connection – keep its output out of the console
    logging:
      driver: none
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s

  app:
    build: .
    container_name: handballhub-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # local run -> local (virtualized) MongoDB, not Atlas
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/handballhub
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      APP_URL: http://localhost:3000
      SEED_ON_START: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

volumes:
  mongo-data:
